<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Tandas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="module">
        import React, { useState, useEffect, useMemo, useRef, Fragment } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import htm from 'https://esm.sh/htm';
        
        const html = htm.bind(React.createElement);

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, addDoc, query, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp, setDoc, getDocs, where } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        
        // Iconos
        import { PiggyBank, Users, PlusCircle, CheckCircle, Clock, Search, LogOut, Shield, Calendar, Trash2, Banknote, ChevronDown, Check, DollarSign, Wallet, FileText, Upload } from 'https://esm.sh/lucide-react@0.263.1';

        // --- CONFIGURACIÓN FIREBASE ACTUALIZADA ---
        const firebaseConfig = {
          apiKey: "AIzaSyC8KmF9035SvVWlZ5HyQrpXcUJmC-ppkVM",
          authDomain: "tandaex-da1c0.firebaseapp.com",
          projectId: "tandaex-da1c0",
          storageBucket: "tandaex-da1c0.firebasestorage.app",
          messagingSenderId: "1090133962867",
          appId: "1:1090133962867:web:8e36e24f61dd60d9db7a06"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function App() {
            const [authUser, setAuthUser] = useState(null); 
            const [dbUser, setDbUser] = useState(null);     
            const [view, setView] = useState('auth');       
            const [tandas, setTandas] = useState([]);
            const [payments, setPayments] = useState([]);
            const [usersList, setUsersList] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const initAuth = async () => {
                    if (!auth.currentUser) await signInAnonymously(auth);
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => { setAuthUser(u); setLoading(false); });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!authUser) return;
                // RUTAS CORREGIDAS A 1 SEGMENTO (Colecciones Raíz)
                const unsubTandas = onSnapshot(query(collection(db, 'tandas')), (s) => setTandas(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))));
                const unsubPayments = onSnapshot(query(collection(db, 'payments')), (s) => setPayments(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))));
                const unsubUsers = onSnapshot(query(collection(db, 'users')), (s) => setUsersList(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                
                return () => { unsubTandas(); unsubPayments(); unsubUsers(); };
            }, [authUser]);

            const handleLogout = () => { setDbUser(null); setView('auth'); };

            if (loading) return html`<div className="flex h-screen items-center justify-center text-emerald-600 font-bold">Cargando Sistema...</div>`;

            return html`
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <nav className="bg-emerald-600 text-white shadow-lg p-3 md:p-4 sticky top-0 z-50">
                        <div className="container mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <${PiggyBank} className="text-emerald-200" size=${28} />
                                <span className="font-bold text-lg md:text-xl tracking-wide">Control de Tandas</span>
                            </div>
                            ${dbUser && html`
                                <div className="flex items-center gap-3 md:gap-4">
                                    <span className="hidden md:inline text-sm font-medium capitalize flex items-center gap-1">
                                        <${Shield} size=${14}/> ${dbUser.fullName || dbUser.username}
                                    </span>
                                    <button onClick=${handleLogout} className="hover:bg-emerald-700 p-2 rounded-full transition" title="Cerrar Sesión"><${LogOut} size=${20} /></button>
                                </div>
                            `}
                        </div>
                    </nav>

                    <main className="container mx-auto p-3 md:p-6 mb-10 flex-grow w-full max-w-5xl">
                        ${view === 'auth' && html`<${AuthView} setDbUser=${setDbUser} setView=${setView} />`}
                        ${view === 'admin' && html`<${AdminView} tandas=${tandas} payments=${payments} usersList=${usersList} user=${dbUser} />`}
                        ${view === 'user' && html`<${UserView} tandas=${tandas} payments=${payments} user=${dbUser} />`}
                    </main>
                </div>
            `;
        }

        // --- AUTENTICACIÓN ---
        function AuthView({ setDbUser, setView }) {
            const [mode, setMode] = useState('login'); 
            const [formData, setFormData] = useState({ fullName: '', username: '', password: '' });
            const [error, setError] = useState('');

            const handleRegister = async (e) => {
                e.preventDefault(); setError('');
                if (!formData.fullName.trim() || !formData.username.trim() || !formData.password) return setError('Llena todos los campos.');
                try {
                    const q = query(collection(db, 'users'), where('username', '==', formData.username));
                    if (!(await getDocs(q)).empty) return setError('El usuario ya existe.');
                    
                    const newUser = { fullName: formData.fullName.trim(), username: formData.username, password: formData.password, role: 'user', createdAt: serverTimestamp() };
                    await setDoc(doc(db, 'users', formData.username), newUser);
                    alert("Registro exitoso. Ahora inicia sesión."); setMode('login');
                } catch (err) { setError("Error al registrar."); }
            };

            const handleLogin = async (e) => {
                e.preventDefault(); setError('');
                try {
                    const docSnap = await getDocs(query(collection(db, 'users'), where('username', '==', formData.username), where('password', '==', formData.password)));
                    if (docSnap.empty) return setError('Credenciales incorrectas.');
                    const userData = docSnap.docs[0].data();
                    setDbUser(userData); setView(userData.role === 'admin' ? 'admin' : 'user');
                } catch (err) { setError("Error de conexión."); }
            };

            return html`
                <div className="flex justify-center items-center min-h-[70vh] animate-fade-in p-4">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3">
                                <${PiggyBank} size=${32} />
                            </div>
                            <h2 className="text-2xl font-black text-slate-800">${mode === 'login' ? 'Iniciar Sesión' : 'Registro'}</h2>
                            <p className="text-slate-500 text-sm mt-1">Gestión Segura de Tandas</p>
                        </div>
                        <form onSubmit=${mode === 'login' ? handleLogin : handleRegister} className="space-y-4">
                            ${mode === 'register' && html`
                                <div><label className="text-xs font-bold text-slate-500 uppercase">Nombre Completo</label>
                                <input type="text" required value=${formData.fullName} onChange=${e => setFormData({...formData, fullName: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-slate-50" /></div>
                            `}
                            <div><label className="text-xs font-bold text-slate-500 uppercase">Usuario</label>
                            <input type="text" required value=${formData.username} onChange=${e => setFormData({...formData, username: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-slate-50" /></div>
                            <div><label className="text-xs font-bold text-slate-500 uppercase">Contraseña</label>
                            <input type="password" required value=${formData.password} onChange=${e => setFormData({...formData, password: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-slate-50" /></div>
                            
                            ${error && html`<div className="bg-red-50 text-red-600 text-sm p-3 rounded-lg flex items-center gap-2 font-medium"><${Clock} size=${16}/> ${error}</div>`}
                            <button type="submit" className="w-full bg-emerald-600 text-white py-3.5 rounded-lg font-bold hover:bg-emerald-700 transition shadow-md">${mode === 'login' ? 'Entrar al Sistema' : 'Crear Cuenta'}</button>
                        </form>
                        <div className="mt-6 text-center text-sm">
                            ${mode === 'login' 
                                ? html`<button onClick=${() => setMode('register')} className="text-emerald-600 font-bold hover:underline">¿No tienes cuenta? Regístrate</button>`
                                : html`<button onClick=${() => setMode('login')} className="text-slate-600 font-bold hover:underline">Volver al inicio de sesión</button>`
                            }
                        </div>
                    </div>
                </div>
            `;
        }

        // --- VISTA ADMINISTRADOR ---
        function AdminView({ tandas, payments, usersList }) {
            const [tab, setTab] = useState('tandas');
            
            return html`
                <div className="bg-white rounded-2xl shadow-sm border min-h-[80vh] overflow-hidden flex flex-col animate-fade-in">
                    <div className="flex border-b bg-slate-50 overflow-x-auto hide-scrollbar">
                        <button onClick=${() => setTab('tandas')} className=${`flex-1 py-4 px-4 font-bold flex items-center justify-center gap-2 border-b-2 transition whitespace-nowrap ${tab === 'tandas' ? 'border-emerald-600 text-emerald-700 bg-white' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}><${Calendar} size=${18} /> Tandas</button>
                        <button onClick=${() => setTab('payments')} className=${`flex-1 py-4 px-4 font-bold flex items-center justify-center gap-2 border-b-2 transition whitespace-nowrap ${tab === 'payments' ? 'border-emerald-600 text-emerald-700 bg-white' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}><${CheckCircle} size=${18} /> Pagos</button>
                        <button onClick=${() => setTab('users')} className=${`flex-1 py-4 px-4 font-bold flex items-center justify-center gap-2 border-b-2 transition whitespace-nowrap ${tab === 'users' ? 'border-emerald-600 text-emerald-700 bg-white' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}><${Users} size=${18} /> Usuarios</button>
                    </div>
                    <div className="p-4 md:p-6 flex-grow">
                        ${tab === 'tandas' && html`<${AdminTandas} tandas=${tandas} usersList=${usersList} />`}
                        ${tab === 'payments' && html`<${AdminPagos} payments=${payments} tandas=${tandas} />`}
                        ${tab === 'users' && html`<${AdminUsuarios} usersList=${usersList} />`}
                    </div>
                </div>
            `;
        }

        function AdminTandas({ tandas, usersList }) {
            const [name, setName] = useState('');
            const [amount, setAmount] = useState('');
            const [frequency, setFrequency] = useState('semanal');
            const [startDate, setStartDate] = useState('');
            const [participants, setParticipants] = useState([]); // [{ username, fullName }]

            const availableUsers = usersList.filter(u => u.role !== 'admin' && !participants.some(p => p.username === u.username));

            const addParticipant = (e) => {
                const username = e.target.value;
                if(!username) return;
                const userObj = usersList.find(u => u.username === username);
                setParticipants([...participants, { username: userObj.username, fullName: userObj.fullName }]);
                e.target.value = "";
            };

            const removeParticipant = (idx) => {
                setParticipants(participants.filter((_, i) => i !== idx));
            };

            const handleCreate = async () => {
                if (!name || !amount || !startDate || participants.length === 0) return alert("Faltan datos o participantes.");
                
                // Calcular fechas
                const calculatedParticipants = participants.map((p, index) => {
                    const order = index + 1;
                    const payoutDate = new Date(startDate);
                    if (frequency === 'semanal') payoutDate.setDate(payoutDate.getDate() + (7 * order));
                    if (frequency === 'quincenal') payoutDate.setDate(payoutDate.getDate() + (15 * order));
                    if (frequency === 'mensual') payoutDate.setMonth(payoutDate.getMonth() + order);

                    return { ...p, order, payoutDate: payoutDate.toISOString().split('T')[0] };
                });

                await addDoc(collection(db, 'tandas'), {
                    name,
                    amount: Number(amount),
                    frequency,
                    startDate,
                    status: 'active',
                    participants: calculatedParticipants,
                    createdAt: serverTimestamp()
                });

                setName(''); setAmount(''); setStartDate(''); setParticipants([]);
                alert("Tanda creada y fechas asignadas automáticamente.");
            };

            const handleDelete = async (tId) => {
                if (confirm("¿Eliminar esta tanda permanentemente?")) {
                    await deleteDoc(doc(db, 'tandas', tId));
                }
            };

            return html`
                <div className="grid lg:grid-cols-2 gap-8">
                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                        <h3 className="font-black text-lg mb-4 flex items-center gap-2"><${PlusCircle} className="text-emerald-600"/> Crear Nueva Tanda</h3>
                        <div className="space-y-4">
                            <div><label className="text-xs font-bold text-slate-500 uppercase">Nombre / Grupo</label>
                            <input value=${name} onChange=${e => setName(e.target.value)} placeholder="Ej. Tanda Godín 2026" className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" /></div>
                            
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-xs font-bold text-slate-500 uppercase">Monto por turno ($)</label>
                                <input type="number" value=${amount} onChange=${e => setAmount(e.target.value)} placeholder="Ej. 1000" className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" /></div>
                                <div><label className="text-xs font-bold text-slate-500 uppercase">Frecuencia</label>
                                <select value=${frequency} onChange=${e => setFrequency(e.target.value)} className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                                    <option value="semanal">Semanal</option>
                                    <option value="quincenal">Quincenal</option>
                                    <option value="mensual">Mensual</option>
                                </select></div>
                            </div>

                            <div><label className="text-xs font-bold text-slate-500 uppercase">Fecha de Inicio (Primer Pago)</label>
                            <input type="date" value=${startDate} onChange=${e => setStartDate(e.target.value)} className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" /></div>

                            <div className="pt-2 border-t border-slate-200">
                                <label className="text-xs font-bold text-slate-500 uppercase mb-2 block">Participantes (Orden de cobro)</label>
                                <select onChange=${addParticipant} className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white mb-3">
                                    <option value="">-- Agregar participante --</option>
                                    ${availableUsers.map(u => html`<option key=${u.username} value=${u.username}>${u.fullName} (${u.username})</option>`)}
                                </select>
                                
                                <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                                    ${participants.map((p, i) => html`
                                        <div key=${i} className="flex justify-between items-center bg-white p-2 border rounded-lg shadow-sm">
                                            <div className="flex items-center gap-3">
                                                <div className="bg-emerald-100 text-emerald-800 font-black w-6 h-6 rounded-full flex items-center justify-center text-xs">${i+1}</div>
                                                <span className="font-medium text-sm">${p.fullName}</span>
                                            </div>
                                            <button onClick=${() => removeParticipant(i)} className="text-red-500 hover:bg-red-50 p-1.5 rounded"><${Trash2} size=${16}/></button>
                                        </div>
                                    `)}
                                    ${participants.length === 0 && html`<p className="text-xs text-slate-400 italic text-center py-2">Sin participantes.</p>`}
                                </div>
                            </div>

                            <button onClick=${handleCreate} className="w-full bg-emerald-600 text-white py-3.5 rounded-lg font-bold hover:bg-emerald-700 transition shadow-md mt-4 flex justify-center items-center gap-2"><${Check} size=${18}/> Guardar y Generar Fechas</button>
                        </div>
                    </div>

                    <div>
                        <h3 className="font-black text-lg mb-4 flex items-center gap-2"><${Calendar} className="text-slate-600"/> Tandas Activas</h3>
                        <div className="space-y-4 overflow-y-auto max-h-[600px] hide-scrollbar pr-1">
                            ${tandas.map(t => html`
                                <div key=${t.id} className="border border-slate-200 rounded-xl bg-white shadow-sm overflow-hidden">
                                    <div className="bg-slate-50 p-3 border-b flex justify-between items-center">
                                        <div>
                                            <h4 className="font-black text-slate-800 text-lg">${t.name}</h4>
                                            <p className="text-xs text-slate-500 font-medium">Bolsa: $${t.amount * t.participants.length} | ${t.frequency} | ${t.participants.length} números</p>
                                        </div>
                                        <button onClick=${() => handleDelete(t.id)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg transition"><${Trash2} size=${18}/></button>
                                    </div>
                                    <div className="p-0">
                                        <table className="w-full text-xs text-left">
                                            <thead className="bg-slate-100 text-slate-600">
                                                <tr><th className="p-2">#</th><th className="p-2">Socio</th><th className="p-2 text-right">Fecha Cobro</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                ${t.participants.map(p => html`
                                                    <tr key=${p.username} className="hover:bg-slate-50">
                                                        <td className="p-2 font-bold text-emerald-600">${p.order}</td>
                                                        <td className="p-2 font-medium">${p.fullName}</td>
                                                        <td className="p-2 text-right text-slate-500">${p.payoutDate}</td>
                                                    </tr>
                                                `)}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            `)}
                            ${tandas.length === 0 && html`<div className="text-center p-8 border-2 border-dashed rounded-xl text-slate-400"><p>No hay tandas creadas.</p></div>`}
                        </div>
                    </div>
                </div>
            `;
        }

        function AdminPagos({ payments, tandas }) {
            const toggleStatus = async (pId, currentStatus) => {
                await updateDoc(doc(db, 'payments', pId), {
                    status: currentStatus === 'pending' ? 'approved' : 'pending'
                });
            };

            const delPayment = async (pId) => {
                if(confirm("¿Borrar registro de pago?")) {
                    await deleteDoc(doc(db, 'payments', pId));
                }
            };

            return html`
                <div>
                    <h3 className="font-black text-lg mb-4">Validación de Pagos</h3>
                    <div className="bg-white border rounded-xl shadow-sm overflow-hidden">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-slate-50 text-slate-600 border-b">
                                <tr><th className="p-3">Socio</th><th className="p-3">Tanda</th><th className="p-3">Monto</th><th className="p-3">Referencia</th><th className="p-3">Estado</th><th className="p-3 text-center">Acción</th></tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                ${payments.length === 0 ? html`<tr><td colSpan="6" className="p-8 text-center text-slate-400 italic">No hay pagos registrados.</td></tr>` : 
                                payments.map(p => {
                                    const tanda = tandas.find(t => t.id === p.tandaId);
                                    return html`
                                        <tr key=${p.id} className="hover:bg-slate-50 transition">
                                            <td className="p-3 font-medium text-slate-800">${p.userFullName}</td>
                                            <td className="p-3 text-slate-500">${tanda ? tanda.name : 'Desc.'} <span className="text-[10px] bg-slate-200 px-1 rounded ml-1">#${p.periodNumber}</span></td>
                                            <td className="p-3 font-black text-emerald-600">$${p.amount}</td>
                                            <td className="p-3 font-mono text-xs bg-yellow-50 text-yellow-800 px-2 py-1 rounded inline-block mt-2 border border-yellow-100">${p.receiptRef}</td>
                                            <td className="p-3">
                                                <span className=${`px-2 py-1 rounded text-[10px] font-bold flex w-fit items-center gap-1 ${p.status === 'approved' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`}>
                                                    ${p.status === 'approved' ? 'APROBADO' : 'PENDIENTE'}
                                                </span>
                                            </td>
                                            <td className="p-3 flex gap-2 justify-center">
                                                <button onClick=${() => toggleStatus(p.id, p.status)} className=${`text-xs border px-3 py-1.5 rounded-lg font-bold transition flex items-center gap-1 ${p.status === 'approved' ? 'bg-white text-slate-500 hover:bg-slate-100 border-slate-200' : 'bg-emerald-600 text-white hover:bg-emerald-700 border-transparent shadow-sm'}`}>
                                                    ${p.status === 'approved' ? 'Revocar' : 'Aprobar'}
                                                </button>
                                                <button onClick=${() => delPayment(p.id)} className="text-slate-400 hover:text-red-500 p-1.5 hover:bg-red-50 rounded-lg transition"><${Trash2} size=${16}/></button>
                                            </td>
                                        </tr>
                                    `
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function AdminUsuarios({ usersList }) {
            const players = usersList.filter(u => u.role !== 'admin');
            return html`
                <div className="max-w-2xl mx-auto">
                    <h3 className="font-black text-lg mb-4">Directorio de Socios</h3>
                    <div className="bg-white border rounded-xl shadow-sm overflow-hidden">
                        <ul className="divide-y divide-slate-100">
                            ${players.length === 0 ? html`<li className="p-8 text-center text-slate-400">Sin socios registrados.</li>` : 
                            players.map(u => html`
                                <li key=${u.username} className="p-4 flex items-center justify-between hover:bg-slate-50">
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 font-black flex items-center justify-center">${u.fullName.charAt(0).toUpperCase()}</div>
                                        <div>
                                            <p className="font-bold text-slate-800">${u.fullName}</p>
                                            <p className="text-xs text-slate-500 font-mono">@${u.username}</p>
                                        </div>
                                    </div>
                                    <span className="bg-blue-50 text-blue-600 text-xs px-2 py-1 rounded font-bold">Activo</span>
                                </li>
                            `)}
                        </ul>
                    </div>
                </div>
            `;
        }

        // --- VISTA USUARIO (SOCIO) ---
        function UserView({ tandas, payments, user }) {
            const [selectedTandaId, setSelectedTandaId] = useState('');
            const [period, setPeriod] = useState(1);
            const [receipt, setReceipt] = useState('');

            // Tandas en las que participa el usuario
            const myTandas = useMemo(() => {
                return tandas.filter(t => t.participants.some(p => p.username === user.username));
            }, [tandas, user]);

            const handlePay = async (e) => {
                e.preventDefault();
                if (!selectedTandaId || !receipt.trim()) return alert("Selecciona tanda y escribe la referencia.");
                const tanda = myTandas.find(t => t.id === selectedTandaId);
                
                await addDoc(collection(db, 'payments'), {
                    tandaId: selectedTandaId,
                    username: user.username,
                    userFullName: user.fullName,
                    periodNumber: period,
                    amount: tanda.amount,
                    receiptRef: receipt.trim(),
                    status: 'pending',
                    createdAt: serverTimestamp()
                });

                setReceipt('');
                alert("Pago reportado exitosamente. Espera validación del administrador.");
            };

            const myPayments = payments.filter(p => p.username === user.username);

            return html`
                <div className="grid lg:grid-cols-12 gap-6 animate-fade-in">
                    
                    <!-- Panel Izquierdo: Mis Tandas y Fechas -->
                    <div className="lg:col-span-7 space-y-6">
                        <h2 className="text-2xl font-black text-slate-800 flex items-center gap-2"><${Wallet} className="text-emerald-600"/> Mis Tandas Activas</h2>
                        
                        ${myTandas.length === 0 ? html`
                            <div className="bg-white p-10 rounded-2xl border border-dashed border-slate-300 text-center text-slate-500 shadow-sm">
                                <${Calendar} size=${48} className="mx-auto mb-3 opacity-20"/>
                                <p>Aún no estás asignado a ninguna tanda.</p>
                            </div>
                        ` : myTandas.map(t => {
                            const myTurn = t.participants.find(p => p.username === user.username);
                            // Calcular progreso general
                            const maxTurns = t.participants.length;
                            const today = new Date().toISOString().split('T')[0];
                            const isMyTurnSoon = myTurn.payoutDate >= today && myTurn.payoutDate <= new Date(Date.now() + 7*24*60*60*1000).toISOString().split('T')[0];
                            
                            return html`
                                <div key=${t.id} className="bg-white rounded-2xl shadow-sm border overflow-hidden relative">
                                    <div className="bg-gradient-to-r from-emerald-600 to-teal-600 p-5 text-white">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h3 className="text-xl font-black mb-1">${t.name}</h3>
                                                <p className="text-sm opacity-90 flex items-center gap-1"><${CheckCircle} size=${14}/> Frecuencia: ${t.frequency}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-xs opacity-80 uppercase tracking-widest font-bold">Monto/Turno</p>
                                                <p className="text-2xl font-black">$${t.amount}</p>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="p-5 flex flex-col md:flex-row items-center gap-6">
                                        <div className=${`w-full md:w-1/2 p-4 rounded-xl border-2 flex flex-col items-center justify-center text-center ${isMyTurnSoon ? 'border-orange-400 bg-orange-50' : 'border-emerald-100 bg-emerald-50'}`}>
                                            <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Tu Turno</p>
                                            <p className=${`text-5xl font-black mb-2 ${isMyTurnSoon ? 'text-orange-500' : 'text-emerald-600'}`}>#${myTurn.order}</p>
                                            <p className="text-xs font-bold text-slate-500 uppercase">de ${maxTurns}</p>
                                        </div>
                                        
                                        <div className="w-full md:w-1/2 space-y-3">
                                            <div>
                                                <p className="text-xs font-bold text-slate-500 uppercase">Recibes tu dinero el:</p>
                                                <p className=${`text-xl font-black flex items-center gap-2 ${isMyTurnSoon ? 'text-orange-600' : 'text-slate-800'}`}><${Calendar} size=${20}/> ${myTurn.payoutDate}</p>
                                            </div>
                                            <div className="bg-slate-50 p-3 rounded-lg border text-xs text-slate-600">
                                                Bolsa estimada a recibir: <strong className="text-emerald-700 text-sm">$${t.amount * maxTurns}</strong>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `
                        })}
                    </div>

                    <!-- Panel Derecho: Registrar Pagos y Status -->
                    <div className="lg:col-span-5 space-y-6">
                        
                        <!-- Formulario Pago -->
                        <div className="bg-white p-5 rounded-2xl shadow-sm border">
                            <h3 className="font-black text-lg mb-4 flex items-center gap-2 text-slate-800"><${Upload} className="text-emerald-600" size=${20}/> Reportar Pago</h3>
                            <form onSubmit=${handlePay} className="space-y-4">
                                <div><label className="text-xs font-bold text-slate-500 uppercase">Selecciona la Tanda</label>
                                <select value=${selectedTandaId} onChange=${e => setSelectedTandaId(e.target.value)} className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-slate-50">
                                    <option value="">-- Seleccionar --</option>
                                    ${myTandas.map(t => html`<option key=${t.id} value=${t.id}>${t.name} ($${t.amount})</option>`)}
                                </select></div>
                                
                                <div><label className="text-xs font-bold text-slate-500 uppercase">Número de Periodo (Pago #)</label>
                                <input type="number" min="1" value=${period} onChange=${e => setPeriod(e.target.value)} className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-slate-50" /></div>
                                
                                <div><label className="text-xs font-bold text-slate-500 uppercase">Referencia / Folio de Transferencia</label>
                                <input type="text" placeholder="Ej. 1234567890" value=${receipt} onChange=${e => setReceipt(e.target.value)} className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-slate-50" /></div>
                                
                                <button type="submit" className="w-full bg-slate-800 text-white py-3 rounded-lg font-bold hover:bg-slate-900 transition flex justify-center items-center gap-2">Enviar Comprobante</button>
                            </form>
                        </div>

                        <!-- Historial -->
                        <div className="bg-white p-5 rounded-2xl shadow-sm border">
                            <h3 className="font-black text-lg mb-4 flex items-center gap-2 text-slate-800"><${FileText} className="text-slate-500" size=${20}/> Mi Historial de Pagos</h3>
                            <div className="space-y-3 max-h-64 overflow-y-auto pr-1">
                                ${myPayments.length === 0 ? html`<p className="text-sm text-slate-400 italic text-center py-4">No has reportado pagos.</p>` :
                                myPayments.map(p => {
                                    const tanda = tandas.find(t => t.id === p.tandaId);
                                    return html`
                                        <div key=${p.id} className="flex justify-between items-center p-3 border rounded-lg bg-slate-50">
                                            <div>
                                                <p className="font-bold text-sm text-slate-800">${tanda ? tanda.name : 'Tanda'} <span className="text-[10px] text-slate-500 font-normal">Pago #${p.periodNumber}</span></p>
                                                <p className="text-xs font-mono text-slate-500 mt-1">Ref: ${p.receiptRef}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="font-black text-emerald-600 mb-1">$${p.amount}</p>
                                                <span className=${`text-[10px] px-2 py-0.5 rounded font-bold ${p.status === 'approved' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`}>
                                                    ${p.status === 'approved' ? 'OK' : 'PENDIENTE'}
                                                </span>
                                            </div>
                                        </div>
                                    `
                                })}
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
</body>
</html>
